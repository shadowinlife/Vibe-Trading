# A7 targeted query set for the LLM-judge T-A7 evaluation.
#
# 60 entries, ~10 per A7 description change, each tagged with the change's
# arbitration_ref. Mix of:
#   * regression-guard queries the baseline already routes correctly, and
#   * hard/adversarial queries probing the exact confusion the change removes
#     (these are the only queries that can demonstrate an improvement — a
#     baseline-pass query can only regress).
#
# Schema matches queries.yaml: id / query / expected{kind,name} / domain /
# negatives / arbitration_ref.

version: 1
entries:
  # ── ① Q5 · correlation-analysis 删 "pair-trading signal generation" 越界 ──
  # 相关性/协整"分析"仍归 correlation-analysis
  - id: A7-01
    query: 计算这两只股票日收益率的滚动相关系数序列
    expected: {kind: skill, name: correlation-analysis}
    domain: D09
    negatives: [pair-trading]
    arbitration_ref: Q5
  - id: A7-02
    query: 对这两只标的做 Engle-Granger 协整检验并给出误差修正项
    expected: {kind: skill, name: correlation-analysis}
    domain: D09
    negatives: [pair-trading, quant-statistics]
    arbitration_ref: Q5
  - id: A7-03
    query: 帮我做板块内股票收益的相关性聚类分析
    expected: {kind: skill, name: correlation-analysis}
    domain: D09
    negatives: [pair-trading]
    arbitration_ref: Q5
  - id: A7-04
    query: 用 Kalman 滤波估计两个资产间的动态对冲比率
    expected: {kind: skill, name: correlation-analysis}
    domain: D09
    negatives: [pair-trading]
    arbitration_ref: Q5
  - id: A7-05
    query: 分析 BTC 和 ETH 的联动性，相关系数最近怎么变了
    expected: {kind: skill, name: correlation-analysis}
    domain: D09
    negatives: [pair-trading]
    arbitration_ref: Q5
  # 配对交易"信号/策略"应归 pair-trading，不再被越界声明抢走
  - id: A7-06
    query: 给我一对协整股票的配对交易买卖信号
    expected: {kind: skill, name: pair-trading}
    domain: D09
    negatives: [correlation-analysis]
    arbitration_ref: Q5
  - id: A7-07
    query: 基于价差 Z-score 的配对交易开平仓策略
    expected: {kind: skill, name: pair-trading}
    domain: D09
    negatives: [correlation-analysis]
    arbitration_ref: Q5
  - id: A7-08
    query: 构造一个统计套利配对组合并做回测
    expected: {kind: skill, name: pair-trading}
    domain: D09
    negatives: [correlation-analysis]
    arbitration_ref: Q5
  - id: A7-09
    query: 两个高相关标的的均值回归配对交易规则怎么定
    expected: {kind: skill, name: pair-trading}
    domain: D09
    negatives: [correlation-analysis]
    arbitration_ref: Q5
  - id: A7-10
    query: 帮我找适合做 pair trading 的股票对并给出交易信号
    expected: {kind: skill, name: pair-trading}
    domain: D09
    negatives: [correlation-analysis]
    arbitration_ref: Q5

