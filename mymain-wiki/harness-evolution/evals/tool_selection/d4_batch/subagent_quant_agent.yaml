description: 'Quantitative strategy research and backtesting workspace. Delegate: alpha zoo browsing/benching
  (Kakushadze/GTJA/Qlib 因子库), factor IC/IR analysis and quantile backtests, strategy catalogue queries
  with per-regime evidence, writing and running signal_engine backtests, backtest diagnosis, ML walk-forward
  strategies, execution cost modeling, K-line pattern recognition on fetched data (K线形态识别), backtest workspace
  file read/write (回测工作区的 config/metrics/signal_engine 读写), and strategy export (Pine/通达信/vnpy). 量化策略研究与回测：
  因子、IC、策略生成与诊断、回测工作区。 NOT for: standalone risk metrics on an existing portfolio (VaR/Sharpe of held positions
  → main agent''s quantlib_call), options/perpetual derivatives strategies, standalone technical-analysis
  reads with no strategy/backtest context — pure indicator values, candlestick/ichimoku/缠论/SMC school
  analysis; and bare strategy-concept mentions without an execution or teaching verb (仅策略概念咨询 → main agent),
  event/news-driven strategy design, raw quote browsing (get_market_data), fundamentals/filings, web reading,
  or live trading.'
