    parent that would route to this subagent already holds run_swarm/list_swarm_presets as always-on tools,
    so the parent must still recognize "this needs a swarm" to make the delegation, at which point it
    can call run_swarm itself; the subagent adds a hop without shrinking any decision surface. (2) The
    research-goal tools are session-state spine — delegating evidence-ledger writes across an agent boundary
    breaks the audit model where the main agent''s goal tracks the whole conversation. (3) A subagent
    calling run_swarm spawns a swarm from a worker-like context whose nesting semantics the runtime does
    not define. (4) The real confusion risk here is run_swarm vs host-native orchestration (K12), which
    is a description-level arbitration problem, not a whitelist problem. These ten tools stay always-on
    at the main agent per audit §8.2 input 2.'
boundary_matrix:
- pair: market-data-agent × fundamentals-text-agent
  risk: high
  confusion: 'A-share screening triple (K13): iwencai_search (MD) vs fundamental-filter skill (FT) vs
    screen_market (MD) — "帮我选低估值银行股" hits all three. Rule: natural-language A-share screen → MD/iwencai;
    PE/PB/ROE field filter workflow → FT; same-day price/volume ranking only → MD.'
- pair: market-data-agent × derivatives-agent
  risk: medium
  confusion: Underlying spot/vol/IV inputs — options work needs market data, but DV never fetches; the
    parent chains MD → DV. "BTC 期权" phrasing touches both.
- pair: market-data-agent × risk-portfolio-agent
  risk: low
  confusion: Returns series are the input to every RP computation; RP consumes parent-supplied series
    and never fetches. Little lexical overlap.
- pair: market-data-agent × valuation-agent
  risk: low
  confusion: VL fetches nothing; only the generic word "price/估值" is shared.
- pair: market-data-agent × macro-sector-agent
  risk: high
  confusion: 'get_sector_info (MS) vs screen_market / get_fund_flow (MD): "板块资金 流向" and "行业排名" phrasings
    sit on the cut. Rule: board membership / board ranking → MS; per-stock or market-wide money flow →
    MD.'
- pair: market-data-agent × altdata-agent
  risk: medium
  confusion: '"BTC 数据" ambiguity — OHLCV/order-book (MD) vs on-chain/sentiment (AD). Rule: price/depth
    data → MD; chain metrics and mood → AD.'
- pair: market-data-agent × funds-fi-agent
  risk: medium
  confusion: '"ETF 数据" ambiguity — ETF price/volume bars (MD) vs ETF holdings and product metrics (FF).'
- pair: market-data-agent × user-analytics-agent
  risk: low
  confusion: Shadow backtests fetch internally through the backtest engine; no shared user-facing verbs.
- pair: market-data-agent × trading-connector-agent
  risk: high
  confusion: 'K21 direct tool collision: trading_quote / trading_history (TC) vs get_market_data (MD)
    both return quotes/bars. Rule: no connector configured → MD; account-view or connector-realtime →
    TC.'
- pair: market-data-agent × orchestrator
  risk: low
  confusion: Disjoint (data fetch vs governance verbs); orchestrator is recommended for rejection anyway.
- pair: fundamentals-text-agent × derivatives-agent
  risk: low
  confusion: Earnings-event option plays touch both; FT fetches the fundamental facts, DV prices the option
    structure. Sequential, not competing.
- pair: fundamentals-text-agent × risk-portfolio-agent
  risk: medium
  confusion: '"资产负债表风险" phrasing — credit scores (Altman Z via RP/quantlib) vs statement data (FT). Rule:
    fetch → FT; score/compute → RP.'
- pair: fundamentals-text-agent × valuation-agent
  risk: high
  confusion: 'Earnings estimates: get_research_reports (FT, consensus data) vs earnings-forecast / earnings-revision
    skills (VL, SUE/PEAD analysis); statement fetch vs interpretation generally. Rule: FT fetches and
    reads, VL interprets.'
- pair: fundamentals-text-agent × macro-sector-agent
  risk: medium
  confusion: '"行业数据/研报" phrasing — FT is company-level structured data; MS is macro series and board rankings.
    Industry research-report full text is host-side, outside both.'
- pair: fundamentals-text-agent × altdata-agent
  risk: high
  confusion: 'K17: get_stock_news (FT) vs social-media-intelligence (AD) — "最近有什么 关于 XX 的消息" hits both.
    Rule: structured per-stock news → FT; social chatter → AD; news miss → web-docs-agent fallback.'
- pair: fundamentals-text-agent × funds-fi-agent
  risk: medium
  confusion: Issuer financials for credit analysis (FT fetches, FF analyzes) and 13F manager books (FT)
    vs fund manager evaluation (FF) — "基金公司持仓" straddles.
- pair: fundamentals-text-agent × user-analytics-agent
  risk: low
  confusion: Disjoint — journal parsing is not fundamentals.
- pair: fundamentals-text-agent × trading-connector-agent
  risk: medium
  confusion: '"我持有的公司财报" mixes identity/holdings (TC) with statement fetch (FT); the parent chains TC
    → FT.'
- pair: fundamentals-text-agent × orchestrator
  risk: low
  confusion: Disjoint.
- pair: derivatives-agent × risk-portfolio-agent
  risk: medium
  confusion: 'Greeks/BS pricing (DV) vs VaR/EVT on an option position (RP), and hedging-strategy skill
    (RP) vs option protection legs (DV) — "用期权 对冲" sits on the cut. Rule: design the hedge ratio → RP;
    price the option leg → DV.'
- pair: derivatives-agent × valuation-agent
  risk: medium
  confusion: Earnings-event option strategies — VL owns the earnings-event view, DV owns the option structure
    built around it.
- pair: derivatives-agent × macro-sector-agent
  risk: medium
  confusion: Commodity futures term structure (DV) vs commodity supply-demand framework (MS) — "原油期限结构/怎么看铜价"
    phrasing overlaps.
- pair: derivatives-agent × altdata-agent
  risk: high
  confusion: 'K11: funding-rate/basis themes span crypto-derivatives and perp-funding-basis (DV) vs liquidation-heatmap
    and stablecoin-flow (AD). Rule: strategy/carry construction → DV; market-state data reads → AD.'
- pair: derivatives-agent × funds-fi-agent
  risk: medium
  confusion: Convertible bonds embed options — FF owns converts (债底+内嵌期权博弈); DV owns listed/exchange options.
    "转债期权价值" straddles.
- pair: derivatives-agent × user-analytics-agent
  risk: low
  confusion: Disjoint.
- pair: derivatives-agent × trading-connector-agent
  risk: low
  confusion: Broker option positions are TC reads; pricing/payoff is DV. Sequential.
- pair: derivatives-agent × orchestrator
  risk: low
  confusion: Disjoint.
- pair: risk-portfolio-agent × valuation-agent
  risk: medium
  confusion: 'quantlib_call is shared: valuation.* modules (DCF/comps → VL) vs risk/attribution/performance
    modules (→ RP). "算一下这个组合" needs the noun after it to route.'
- pair: risk-portfolio-agent × macro-sector-agent
  risk: medium
