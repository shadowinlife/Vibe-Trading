schema_version: 1
captured_at: '2026-08-27T07:46:41+00:00'
source:
  tools: mcp_server.mcp.list_tools() (registration order)
  skills: src.agent.skills.SkillsLoader bundled skills (loader order)
tool_count: 59
skill_count: 90
tools:
- name: list_skills
  description: 'List all available finance skills with names and descriptions.


    Returns a JSON array of {name, description, category} for all loaded

    skills. Use load_skill(name) to get the full documentation for any skill.

    When your host already provides these skills natively (e.g. an opencode

    workspace with .opencode/skills), prefer the host''s skill path; this tool

    serves pure MCP clients.'
- name: load_skill
  description: 'Load documentation for a named finance skill.


    A skill over the tool-result cap is returned as a skeleton (outline plus

    per-section summaries) instead of being silently cut off. Request a

    specific section by name, or page through one with offset, to read the

    rest. Use list_skills() first to discover available skills. When your

    host already provides these skills natively (e.g. an opencode workspace

    with .opencode/skills), prefer the host''s skill path; this tool serves

    pure MCP clients.'
- name: start_research_goal
  description: 'Create or replace the current finance research goal for a session.


    This is the MCP entry point for long-running, research-only finance tasks.

    It creates an auditable goal with checklist criteria and supersedes any

    previous current goal for the same session.'
- name: get_research_goal
  description: Return the current finance research goal snapshot for a session.
- name: add_goal_evidence
  description: Append traceable evidence to a finance research goal.
- name: update_research_goal_status
  description: 'Update a finance research goal status after an audit.


    Use this to complete, cancel, block, pause, or otherwise move the current

    goal through its lifecycle. ``complete`` requires one audit row per

    required criterion and verified evidence for satisfied rows.'
- name: backtest
  description: 'Run a vectorized backtest using config.json and code/signal_engine.py.


    The run_dir must contain:

    - config.json: backtest configuration (source, codes, dates, etc.)

    - code/signal_engine.py: strategy signal generation code


    Supported data sources (set in config.json "source" field):

    - "yfinance": HK/US equities (free, no API key needed)

    - "okx": cryptocurrency (free, no API key needed)

    - "tushare": China A-shares (requires TUSHARE_TOKEN env var)

    - "akshare": A-shares, US, HK, futures, forex (free, no API key)

    - "ccxt": crypto from 100+ exchanges (free, no API key)

    - "auto": auto-detect based on symbol format (with fallback)


    Returns metrics (Sharpe, return, drawdown, etc.) and artifact paths.'
- name: factor_analysis
  description: 'Compute factor IC/IR analysis and layered backtest from prepared CSVs.


    Analyzes factor predictive power using Spearman rank IC, IR (IC/std),

    and quantile group return spreads.'
- name: alpha_zoo
  description: Browse the bundled Alpha Zoo registry.
- name: alpha_bench
  description: Benchmark one Alpha Zoo alpha or a complete zoo on a universe.
- name: analyze_options
  description: Calculate Black-Scholes option price and Greeks (Delta, Gamma, Theta, Vega).
- name: analyze_options_payoff
  description: 'Analyze a multi-leg option strategy''s payoff and spot/IV scenarios.


    The expiry summary is analytic rather than chart-grid dependent. Returns

    entry debit/credit and commission, breakevens, bounded or unbounded maximum

    profit/loss, an expiry curve, and a Black-Scholes spot/IV P&L matrix.

    Research only; this tool cannot place orders.'
- name: pattern_recognition
  description: 'Detect technical chart patterns (head-and-shoulders, double top/bottom,

    triangles, wedges, channels) in OHLCV data.


    Reads price data from run_dir/artifacts/ohlcv_*.csv files.

    Can be called before coding (to inform strategy) or after backtest (to analyse).'
- name: read_url
  description: 'Fetch a web page and convert it to clean Markdown text.


    Strips ads, navigation, and styling. Useful for reading API docs,

    financial articles, research reports, and GitHub READMEs.'
- name: read_document
  description: 'Extract text from a PDF document with OCR fallback for scanned pages.


    Supports text-based and image-based PDFs. Automatically uses OCR

    for pages with insufficient extractable text.'
- name: web_search
  description: 'Search the web via DuckDuckGo and return top results.


    Returns titles, URLs, and snippets. Use read_url() to fetch full content

    from any result URL. Free, no API key required.'
- name: write_file
  description: 'Write content to a file in the Vibe-Trading backtest workspace (run_dir).


    Relative paths resolve against the active run directory. Used to create

    config.json and signal_engine.py for backtesting workflows. Host files and

    source code belong to the host''s own file tools, not this one.'
- name: read_file
  description: 'Read a file from the Vibe-Trading backtest workspace (run_dir).


    Relative paths resolve against the active run directory. Use it to inspect

    backtest artifacts such as config.json, signal_engine.py, and result CSVs.

    Host files and source code belong to the host''s own read tool, not this one.'
- name: list_strategies
  description: 'List discoverable strategies across the Alpha Zoo and the SDM strategy store.


    Read-only catalogue of what strategies exist and what state they are in.

    Rows carry identification metadata plus evidence status; use

    get_strategy_evidence for the per-regime evidence behind any strategy.

    Nothing returned is a recommendation — rows below the evidence threshold

    are flagged insufficient/marginal rather than recommended.'
- name: query_strategies
  description: 'Query strategies whose computed per-regime evidence passes the filters.


    Evidence-gated discovery: strategies are ranked by per-regime evidence

    rows from reproducible backtests instead of boolean scenario tags.

    Strategies below the evidence thresholds (trade count, coverage) are

    flagged insufficient/marginal rather than recommended, and the

    sizing-corrected cost screen keeps only strategies that clear their

    breakeven.'
- name: get_strategy_evidence
  description: 'Return the computed per-regime evidence rows for one strategy.


    Read-only evidence detail: shows what reproducible backtests support the

    strategy in each regime — trade count, coverage, Sharpe, and the

    sizing-corrected cost breakeven. Rows below the evidence thresholds are

    flagged insufficient/marginal rather than recommended; the facade refuses

    regime assessments without computed evidence, so absent regimes are an

    honest empty, not a guess.'
- name: list_swarm_presets
  description: 'List available swarm multi-agent team presets.


    Each preset defines a team of specialized agents (e.g. investment committee,

    quant desk, risk committee) that collaborate on complex research tasks.

    Returns preset names, descriptions, agent counts, and required variables.'
- name: run_swarm
  description: 'Run a swarm multi-agent team and stream progress back to the caller.


    Assembles a team of specialized agents that collaborate through a DAG workflow.

    For example, the ''investment_committee'' preset runs bull analyst, bear analyst,

    risk officer, and portfolio manager in sequence.


    Use list_swarm_presets() to see available presets and their required variables.


    The tool keeps the MCP call open via ``Context.report_progress`` while the

    swarm runs, so the caller sees live "N/M tasks complete" updates instead

    of timing out silently. Only if ``wait_seconds`` is exhausted does the

    tool return early with the current ``run_id`` — call ``get_run_result``

    afterwards to fetch the final report.'
- name: get_market_data
  description: "Fetch OHLCV market data for stocks, crypto, or mixed symbols.\n\nSupported sources:\n\
    - \"yfinance\" / \"yahoo\": HK/US/Canada equities (free, e.g. AAPL.US,\n  700.HK, TD.TO, PNG.V)\n\
    - \"okx\": cryptocurrency (free, e.g. BTC-USDT, ETH-USDT)\n- \"tushare\": China A-shares (requires\
    \ TUSHARE_TOKEN, e.g. 000001.SZ)\n- \"baostock\": China A-shares via TCP protocol, bypasses HTTP CDN\
    \ blocks (e.g. 000001.SZ, 601595.SH)\n- \"tencent\": China A-shares via Tencent Finance API (e.g.\
    \ 000001.SZ, 601595.SH)\n- \"akshare\": A-shares, US, HK, futures, forex (free, e.g. 000001.SZ, AAPL.US)\n\
    - \"ccxt\": crypto from 100+ exchanges (free, e.g. BTC/USDT)\n- \"mt5\": forex/metals from a local\
    \ MetaTrader 5 terminal (Windows; e.g. EUR/USD, XAUUSD.FX)\n- \"auto\": auto-detect based on symbol\
    \ format (with fallback)"
- name: get_fund_flow
  description: 'Fetch order-bucket net capital inflow (main/super-large/large/medium/small).


    Markets: A-share (.SH/.SZ/.BJ), Hong Kong (.HK) and US (.US). Use this to

    gauge whether large/main-force money is flowing in or out, as daily history

    or the current session''s per-minute line. One unresolvable symbol is

    reported per-symbol and does not abort the batch.'
- name: get_dragon_tiger
  description: 'Fetch the A-share dragon-tiger board (龙虎榜) for a trade date (Eastmoney).


    Markets: China A-share (SH/SZ). Omit ``code`` for the full-market list of

    every security on the board that day; supply ``code`` to also get that

    security''s ranked top buy/sell brokerage seats. Read-only, no auth.'
- name: get_northbound_flow
  description: 'Fetch Northbound (Stock-Connect) net capital flow for China A-shares.


    Returns the latest realtime net inflow plus recent daily history, split into

    Shanghai-Connect (沪股通) and Shenzhen-Connect (深股通) channels (units: 10k

    CNY) from Eastmoney. Read-only; China A-share market only.'
- name: get_margin_trading
  description: 'Fetch an A-share stock''s daily margin-trading (融资融券) balances (Eastmoney).


    Returns outstanding financing balance, financing buy amount,

    securities-lending balance, and combined RZRQ balance, one row per trading

    day (most recent first). Read-only, no credentials, A-shares only (SH/SZ).'
- name: get_block_trades
  description: 'Fetch recent A-share block trades (大宗交易) for one symbol (Eastmoney).


    Returns per-deal price, volume, amount, the premium/discount versus that

    day''s close, and the buyer/seller broker seats (营业部). Markets: China

    A-share only (.SH/.SZ/.BJ). Read-only.'
- name: get_shareholder_count
  description: 'Fetch mainland A-share quarterly shareholder count (股东户数) (Eastmoney).


    Returns holder count per report period, quarter-over-quarter change

    (absolute and percent), and average holding (shares and market value) per

    account. Markets: China A-shares only (.SH/.SZ/.BJ).'
- name: get_lockup_expiry
  description: 'Fetch Chinese A-share lockup-expiry (restricted-share unlock, 限售解禁) data.


    Pass an A-share ``code`` to get that stock''s full historical unlock

    schedule, or omit it for a market-wide calendar of upcoming unlocks within

    the next ``horizon_days`` (Eastmoney). A large near-term unlock adds

    tradable supply and often pressures the stock. Read-only.'
- name: get_sector_info
  description: 'Look up Chinese A-share sector / concept board info (Eastmoney, no auth).


    Two modes: (1) membership — given a stock ``code``, list the industry and

    concept boards it belongs to; (2) ranking — set ``mode="ranking"`` to rank

    industry boards by today''s percent change (with up/down constituent counts

    and the leading stock). Market: A-share stocks.'
- name: get_research_reports
  description: 'Fetch mainland A-share sell-side research coverage and consensus forecasts.


    Returns recent broker research reports (title, brokerage, analyst, publish

    date, rating) with each broker''s per-year EPS and PE forecasts from

    Eastmoney, plus the market consensus (mean) EPS forecast per forward fiscal

    year from THS (同花顺). Markets: China A-shares only (.SH/.SZ/.BJ).'
- name: get_stock_news
  description: 'Fetch recent financial news headlines, read-only and no auth.


    Markets: China A-share (SH/SZ/BJ) headlines from Eastmoney; US (.US) and

    Hong Kong (.HK) related-instrument matches from Yahoo Finance. Use scope

    "stock" with a ``code`` for one security''s headlines, or scope "global"

    (no code) for broad China-market finance news.'
- name: get_sec_filings
  description: 'Fetch U.S. SEC EDGAR filings or reported XBRL financials for a company.


    Returns a list of recent filings (10-K / 10-Q / 8-K, etc.) with accession

    number, filing and report dates, and the primary-document URL; or, when

    ``metric`` is given, the reported XBRL us-gaap financial series for that

    concept (e.g. Revenues, NetIncomeLoss, Assets). Markets: United States only.'
- name: get_financial_statements
  description: 'Fetch a stock''s financial statements or key per-period indicators.


    Markets: A-share (.SH/.SZ/.BJ, via Sina), US (.US) and Hong Kong (.HK, via

    Eastmoney). Reports come back newest-first as flat per-period rows. Use this

    to read fundamentals before building a valuation or screen.'
- name: get_options_chain
  description: 'Fetch the US-listed options chain (calls and puts) for one expiration.


    Returns per-contract strike, bid/ask, last price, volume, open interest,

    implied volatility, and in-the-money flag, plus the list of available

    expirations (epoch seconds) via Yahoo Finance. Read-only US options data.'
- name: get_stock_profile
  description: 'Fetch a read-only company profile for a US or HK listing (Yahoo Finance).


    Returns valuation key statistics, analyst price targets and

    earnings/revenue estimates, institutional and insider ownership, and the

    analyst recommendation trend. Use this for fundamentals and consensus

    context, not for OHLCV price bars (use get_market_data).'
- name: screen_market
  description: 'Screen a market''s listed instruments and rank the top names by a metric.


    Use this to find today''s biggest movers or most-actively-traded names

    without fetching every symbol. Markets: A-share ("a"), US ("us"), Hong

    Kong ("hk").'
- name: search_symbol
  description: 'Resolve a company name or ticker fragment to candidate trading symbols.


    Returns candidates with their market in the project''s symbol convention

    (A-shares 600519.SH, Hong Kong 00700.HK, U.S. AAPL.US, Canada TD.TO/PNG.V,

    plus crypto/index/FX from Yahoo). Searches Eastmoney and Yahoo and, for U.S.

    equities, attaches the SEC CIK. Use this to turn an ambiguous name into a

    concrete symbol before calling get_market_data or get_sec_filings.'
- name: get_institutional_holdings
  description: 'U.S. institutional equity holdings from SEC Form 13F-HR (free EDGAR data, quarterly, filed
    within 45 days of quarter end). Three modes: mode=''manager_holdings'' returns one manager''s portfolio
    for a quarter, largest position first, optionally with quarter-over-quarter changes (new / increased
    / reduced / closed); mode=''ticker_holders'' returns which managers reported a given stock; mode=''top_managers''
    ranks managers by reported 13F portfolio value. Position values are normalized to USD and each result
    states which unit the filing used. Amendments are followed rather than ignored: a quarter is resolved
    across every filing the manager made for it, where a 13F-HR/A of type RESTATEMENT replaces the earlier
    table and one of type NEW HOLDINGS is merged on top of it, and ''amendment_resolution'' reports which
    filing each answer stands on. LIMITS: 13F covers only U.S.-listed long equity, options and convertibles
    reported by managers over $100M — no shorts, no cash, no non-U.S. listings, and the data is 45+ days
    stale by construction. ticker_holders needs a ticker->CUSIP match in the SEC fails-to-deliver file
    (broad but not universal); pass ''cusip'' directly when a ticker cannot be resolved. top_managers
    ranks within a bounded scanned sample, not the full filer universe. A minority of amendments name
    no amendmentType at all; those are NOT applied and the result is flagged ''incomplete_unspecified_amendment''
    rather than guessed. Example: {"mode": "manager_holdings", "manager": "Berkshire Hathaway", "quarter":
    "2026Q1", "include_changes": true}.'
- name: etf_holdings
  description: 'ETF look-through across two markets. mode=''holdings'' returns an ETF''s constituent holdings
    (security, weight, market value) — for U.S. funds the FULL portfolio from the SEC N-PORT filing, for
    A-share funds the holdings disclosed in the fund''s own periodic report. mode=''lookup'' searches
    funds by ticker, name or theme and returns their identity and size. Market is auto-detected: ''.SH''/''.SZ''
    or a bare six-digit code goes to the A-share path, anything else to the U.S. path. For A-share funds,
    disclosure=''full'' returns the COMPLETE portfolio from the newest interim or annual report (hundreds
    of names, ~95-100% of net assets) while the default disclosure=''latest'' returns the most recent
    period, which between reports is a quarterly top-N — read ''coverage'' and ''pct_of_net_assets_disclosed''
    to tell which you got. Every answer carries ''as_of'', the report period the holdings belong to —
    ETF holdings are disclosed with a lag and are never live, and the full A-share portfolio is the more
    complete but older of the two. Fields the source does not publish (expense ratio in particular) are
    listed under ''missing_fields'' and never estimated. Examples: {"mode": "holdings", "symbol": "IVV",
    "top_n": 20} or {"mode": "holdings", "symbol": "510300.SH", "disclosure": "full", "top_n": 400} or
    {"mode": "lookup", "query": "semiconductor"}.'
- name: prediction_market
  description: 'READ-ONLY prediction-market (event-contract) data from Polymarket''s public endpoints
    — alternative data for event-driven research. Each outcome share settles at $1 or $0, so its price
    IS the market-implied probability: a 0.63 quote means a 63% chance, never $0.63 of exposure. Every
    quote is returned as ''implied_probability'' (0-1) plus ''implied_probability_pct'' (0-100). Modes:
    ''search'' (find events by keyword), ''event'' (one or more events with the markets beneath them),
    ''market'' (current top-of-book quote and probabilities, optional order-book depth), ''history'' (implied-probability
    time series for one outcome). CLOSED AND RESOLVED ARE DIFFERENT: every record carries a lifecycle
    ''status'' (open / closed / resolved / inactive / archived) AND a separate ''resolution'' block whose
    ''state'' is ''unresolved'' (still trading), ''pending'' (trading ended but nothing states the outcome)
    or ''resolved'' (a resolution record exists, named in ''resolution.state_basis''). Never report a
    market as settled on ''status'' alone, and never report ''implied_winning_outcome'' as the result
    — it is a price inference, not a settlement. This tool cannot trade and exposes no order or account
    surface. Examples: {"mode": "search", "query": "fed rate cut", "status": "open"} · {"mode": "market",
    "ids": ["2774056"], "depth": 5} · {"mode": "history", "ids": ["2774056"], "interval": "1m", "outcome":
    "Yes"}.'
- name: research_papers
  description: 'Search academic finance/ML papers and turn a paper into a FACTOR BRIEF that feeds our
    own factor loop. Sources: arxiv (preprints, q-fin/cs.LG) and openalex (published journal literature,
    incl. the classic factor papers arXiv does not have). mode=''search'' finds papers by topic / category
    / date window; mode=''read'' returns the structured record for specific ids PLUS a factor_brief extracting
    the proposed signal, the input data it needs, the claimed backtest window and market, the claimed
    performance, and falsifiable reproduction checks. Extraction is evidence-only: every value quotes
    the sentence it came from, and anything the paper does not state is returned as ''not stated in source''
    — never inferred. Only the abstract is available, never the full text, and claimed performance is
    the PAPER''s claim, not our backtest result. Example: {"mode": "search", "source": "arxiv", "query":
    "cross-sectional momentum", "categories": ["q-fin.PM"], "start_date": "2024-01-01"}.'
- name: quantlib_call
  description: 'Compute VaR/CVaR, Black-Scholes prices and Greeks, deflated Sharpe, purged cross-validation,
    DCF / comps valuation — the single entry point to the tested finance-math library (src/quantlib).
    Read-only and pure-compute: it fetches no data and writes no files. Discovery: start with action=''list''
    to see modules, then action=''list'' with a module to see its functions, then action=''describe''
    for a signature. Example: quantlib_call(action="call", module="risk", function="historical_var", kwargs={"returns":
    [0.01, -0.02], "confidence": 0.95}).'
- name: cashflow_performance
  description: Measure the return of an account that received client contributions or paid out withdrawals
    mid-period. Takes a dated valuation series plus irregular cash flows (inline records or a CSV path)
    and returns the true time-weighted return (manager skill, immune to flow timing), the Modified Dietz
    day-weighted approximation, and the money-weighted XIRR (client experience). External flows are contributions,
    capital calls, subscriptions, transfers, distributions, redemptions and withdrawals; dividends, coupons,
    interest and fees are internal and already inside the valuations. Research only; places no orders.
- name: orderbook_depth
  description: 'READ-ONLY crypto L2 order-book snapshot from OKX or Binance spot public REST (via ccxt)
    — the depth/quote feed equity sources here cannot provide. Returns: (1) raw bid/ask levels (price
    + base-asset amount, up to ''levels'' per side); (2) bid-ask spread, absolute and relative in bps;
    (3) depth imbalance within ''levels'' — bid-notional/ask-notional ratio and a normalized (B-A)/(B+A)
    score in [-1, 1]; (4) impact cost — for a simulated market order sized at ''notional_quote'' (in the
    pair''s quote asset, e.g. USDT for BTC-USDT), the volume-weighted average fill price and slippage
    in bps vs. mid price, computed BOTH for a buy (walking asks) and a sell (walking bids). A snapshot
    is only valid for seconds — every response carries a timestamp and ''exchange''. A quote-side that
    can''t fill the full requested notional reports ''fully_filled: false'' with the actually-filled amount,
    never a fabricated full fill. An empty book, a one-sided-empty book, or a crossed book (best_bid >=
    best_ask, a data error) is refused with an explicit error rather than a guessed number. Spot only,
    no perpetuals. Example: {"symbol": "BTC-USDT", "exchange": "okx", "levels": 10, "notional_quote":
    10000}.'
- name: sentiment
  description: 'Score ONE text''s sentiment, or fetch the crypto Fear & Greed index — a dual-mode tool,
    not a market-sentiment framework. Mode ''sentiment_score'': score arbitrary text (news headline, tweet,
    announcement) on -1 (bearish) to 1 (bullish). Mode ''fear_greed_index'': fetch the crypto Fear & Greed
    Index (0-100, lower = more fear). For market-level sentiment frameworks (margin trading / northbound
    flow / put-call ratio), load the sentiment-analysis skill instead. Example: {"mode": "sentiment_score",
    "text": "Tesla beats earnings estimates"}'
- name: technical_indicators
  description: Compute common technical indicators (RSI, MACD, Bollinger Bands, SMA, EMA) for a trading
    symbol. Uses the project's data loaders to fetch price history, then computes indicators locally.
- name: get_fundamentals
  description: 'Fetch PIT-safe fundamental fields as daily wide panels aligned by filed date. Returns
    {field: date x symbol records}. Fields use the unified fundamental schema, e.g. roe, gross_profitability,
    net_income, shares_diluted. Default freq is ttm and PIT mode is on.'
- name: get_swarm_status
  description: 'Get the current status of a swarm run.


    Returns status, task progress, token usage, and an ``is_stale`` flag for

    the specified run. Use this to poll a long-running swarm without blocking.'
- name: get_run_result
  description: 'Get the final report and task summaries of a swarm run.


    Reconciles the run on read: an orphaned ``running`` run whose host

    process exited will be transitioned to its real terminal status

    (``completed`` / ``failed`` / ``cancelled`` derived from the task

    statuses), so the caller never sees a permanent zombie.'
- name: list_runs
  description: 'List recent swarm runs sorted by creation time (newest first).


    Each row includes task counts and an ``is_stale`` flag so callers can

    spot abandoned runs without a follow-up status call.'
- name: retry_run
  description: 'Retry a failed, stale, or cancelled swarm run.


    Re-launches a brand-new run with the same preset and variables as the

    original; the original run is left untouched as a record. Use this after

    spotting a ``failed`` or stale run via ``list_runs``. A still-``running``

    run cannot be retried — cancel or reap it first.


    With ``resume=True`` (replay), completed upstream tasks and their artifacts

    are carried into the new run as-is and only the failed/cancelled subgraph

    re-executes — completed independent branches are not re-run. ``resume``

    only applies to a ``failed`` or ``cancelled`` run; ``resume=True`` for any

    other status is refused with an error (a plain retry without ``resume``

    remains available for any non-running run).'
- name: analyze_trade_journal
  description: "Analyze a user's trade journal (CSV/Excel broker export) and return\na trading profile\
    \ plus behavior diagnostics.\n\nParses 同花顺 / 东方财富 / 富途 / generic formats (encoding auto-detected).\n\
    Output (JSON):\n  - profile: holding days, frequency, win rate, PnL ratio, top symbols,\n        \
    \     market distribution, hourly distribution\n  - behaviors: disposition effect, overtrading, chasing\
    \ momentum,\n               anchoring (each with severity + numeric evidence)"
- name: extract_shadow_strategy
  description: 'Extract a Shadow Account profile (3-5 human-readable if-then rules)

    from the user''s profitable roundtrips in a trade journal.


    Run `analyze_trade_journal` first if the journal hasn''t been parsed.

    Returns shadow_id + rules preview. Profile persists to

    ~/.vibe-trading/shadow_accounts/.'
- name: run_shadow_backtest
  description: 'Run a multi-market backtest (A股/港股/美股/crypto) on a Shadow Account

    profile and compute delta-PnL attribution vs the user''s realized trades.


    Markets are backtested per settlement currency (CNY / HKD / USD pools;

    us + crypto share the USD pool); the headline PnL uses the profile''s

    source-market currency.


    Requires `extract_shadow_strategy` to have run first.'
- name: render_shadow_report
  description: 'Render the Shadow Account HTML/PDF report (8 sections + charts) for

    a shadow_id. If no cached backtest, one is run automatically.'
- name: scan_shadow_signals
  description: 'List today''s symbols that match the Shadow Account''s entry cadence

    (research use only — not a trade recommendation).'
skills:
- name: adr-hshare
  description: ADR/H-share/A-share cross-listing premium analysis — track pricing gaps between US-listed
    ADRs, HK-listed H-shares, and A-shares for arbitrage signals, dual-listing valuation, and delisting
    risk assessment.
- name: akshare
  description: AKShare financial data aggregator (18k+ stars). Free, no API key. Covers A-shares, US,
    HK, futures, macro, forex. Primary fallback for tushare and yfinance.
- name: alpha-zoo
  description: Browse and bench the bundled alpha zoos — prebuilt cross-sectional factor libraries (Kakushadze
    101, GTJA 191, Qlib 158, Fama-French / Carhart). Use when the user asks "which alphas exist", wants
    metadata on a named alpha, or wants to run IC/IR on a whole zoo over a universe.
- name: ashare-pre-st-filter
  description: A 股 ST/*ST 风险预测框架 — 基于最新中报/三季报或业绩预告/快报，预测下一财年是否会因营收、利润、净资产、分红不达标而被风险警示，并将新浪监管处罚记录作为独立证据面纳入风险等级。仅适用于
    A 股，不预测财务造假。
- name: asset-allocation
  description: Asset allocation theory and optimizer usage — MPT / Black-Litterman / risk budgeting /
    all-weather strategy, including guides for 5 optimizers and rebalancing rules.
- name: backtest-diagnose
  description: Diagnose failed or underperforming backtests, locate the root cause, and fix the issue
- name: behavioral-finance
  description: '"Behavioral finance applications: theories of overreaction and underreaction, behavioral
    explanations for momentum and reversal, investor sentiment cycles, cognitive-bias checklists, and
    debiasing quantitative strategies."'
- name: bottleneck-hunter
  description: '"Supply-chain bottleneck arbitrage. Given a super-trend (AI infra, energy transition,
    defense, semiconductor reshoring, space economy), decompose its physical supply chain down to Layer
    2/3 choke points (optics, lasers, InP/SOI substrates, IC substrates, probe cards, specialty fiberglass...)
    and surface under-the-radar listed companies sitting on each bottleneck. Scores each link on 6 scarcity
    criteria, applies mandatory valuation gates (PS/PE/safety-margin) via the financial_rigor tool（内部工具，不在
    MCP 面）, and Munger-style reverse-validates. Outputs a ranked bottleneck opportunity board. Use when
    the user wants hidden beneficiaries of a structural trend rather than already-priced leaders."'
- name: candlestick
  description: Candlestick pattern recognition engine, pure pandas vectorized implementation of 15 classic
    candlestick patterns (5 single-candle + 5 double-candle + 4 triple-candle + 1 trend confirmation),
    generating a composite signal from bullish/bearish pattern scores.
- name: ccxt
  description: CCXT unified crypto exchange library (100+ exchanges). Free public market data. Fallback
    when OKX is unavailable.
- name: chanlun
  description: 基于缠论（缠中说禅）的形态识别引擎，使用czsc库自动检测K线分型、笔、中枢，并生成一买/一卖/二买/二卖/三买/三卖等买卖点信号。支持多周期分析和形态分类（3/5/7/9/11笔形态）。
- name: commodity-analysis
  description: Commodity analysis (oil supply-demand balance / gold pricing / copper as an economic predictor
    / inventory cycles / futures premium-discount structure / seasonality), generating directional commodity
    signals.
- name: convertible-bond
  description: A股可转债分析——转股/纯债/期权三维估值、下修/强赎/回售博弈、双低策略与转债轮动选债框架
- name: corporate-events
  description: 公司事件驱动分析：并购套利价差计算、大股东增减持信号、股权激励解读、定增配股影响评估、A股ST/退市预警
- name: correlation-analysis
  description: Correlation and cointegration analysis — co-movement discovery, deep return-correlation
    analysis, sector clustering, realized correlation, Engle-Granger / Johansen cointegration, half-life,
    Kalman dynamic hedge ratio, cross-market linkage analysis, and pair-trading signal generation
- name: correlation-regime
  description: Correlation-regime detection and crisis attribution — edge-density regime states with hysteresis,
    causal (no look-ahead) smoothing, regime-aware exposure context, first-mover crisis attribution with
    honest NAME / MACRO / AMBIGUOUS / ABSTAIN verdicts, and a correlation-rewiring leaderboard that catches
    slow bleed-outs
- name: credit-analysis
  description: '"固收与信用分析：信用债评级、利差分析、违约风险评估、城投债研究、可转债定价与策略。"'
- name: cross-market-strategy
  description: Write signal_engine.py for portfolios spanning multiple markets (A-shares + crypto, equity
    + forex, etc.)
- name: crypto-derivatives
  description: Crypto-derivatives strategies — perpetual funding-rate arbitrage, futures term-structure
    contango/backwardation trading, and option volatility-smile / Greeks analysis.
- name: data-routing
  description: The single ROUTER for every data need. Load this skill BEFORE any backtest, data-fetch,
    or research task to pick the best available source/tool, honour auth (env) requirements, and avoid
    ban-risk providers.
- name: deep-company-series
  description: '"Write a publication-grade 8-part deep-dive series on a single company (~120k words total):
    cognitive reset / moat / profit engine / hidden assets / era variable (e.g. AI) / financials Buffett-style
    / management / valuation+redlines. The core IP is NOT writing but REVISING — a strict fact-check checklist
    catches pseudo-precision (probability-weighted expectations, third-party MAU discrepancies, linear
    extrapolation), absolute language, and cross-article number inconsistencies that most finance long-forms
    violate. Each piece stands alone but shares one valuation/management/price framework. Use when the
    user wants textbook-level depth on one company for public publishing (a single research report or
    earnings note is NOT this — use investment-research / earnings-review instead)."'
- name: defi-yield
  description: DeFi yield analysis and optimization — lending rates, LP yields, staking returns, yield
    farming strategies, risk-adjusted yield comparison, and protocol-level sustainability assessment.
- name: dividend-analysis
  description: Dividend stock analysis for income, dividend-growth, and shareholder-return strategies,
    including yield quality, payout sustainability, ex-dividend mechanics, and yield-trap checks.
- name: doc-reader
  description: Read any common document/data file — PDF, Word (.docx), Excel (.xlsx/.xls), PowerPoint
    (.pptx), images (OCR), CSV/TSV, plain text, JSON/YAML/TOML, HTML/XML, and most source-code files.
    Use the `read_document` tool.
- name: earnings-forecast
  description: 盈利预测与一致预期分析（自上而下/自下而上预测法/SUE/PEAD/分析师预期修正），捕捉业绩超预期交易机会。
- name: earnings-revision
  description: Earnings estimate revisions, guidance analysis, and post-earnings drift (PEAD) — track
    analyst consensus changes, earnings surprise patterns, and management guidance shifts for US/HK equities.
- name: eastmoney
  description: 东方财富（Eastmoney）免费免鉴权数据接口，覆盖资金流向、龙虎榜、融资融券、大宗交易、股东户数、限售解禁、行业概念板块、券商研报、财经新闻、A股/港股三大报表+主要指标、全市场选股与代码搜索；美股财报由
    get_financial_statements 转 SEC EDGAR。东财请求经共享 IP 限速层节流（东财按源 IP 限流并临时封禁突发请求），通过 Vibe-Trading 工具直接调用，无需
    token。
- name: edgar-sec-filings
  description: SEC EDGAR filing analysis — 10-K, 10-Q, 8-K, proxy statements, insider Form 4. Extract
    key financials, risk factors, management discussion, and generate investment signals from US public
    company filings.
- name: elliott-wave
  description: Elliott Wave Theory signal engine. Detects swing points through Zigzag, matches 5-wave
    impulse and 3-wave corrective structures, validates them with Fibonacci wave relationships, and generates
    trend-top / correction-complete signals. Pure in-house pandas implementation.
- name: etf-analysis
  description: '"ETF分析：产品筛选、费率对比、跟踪误差、流动性评估、策略应用与中国市场ETF量化配置框架。"'
- name: event-driven
  description: Event-driven strategy based on sentiment-scored signals from news, announcements, and macro
    events. The LLM acts as the NLP engine, and event data follows a CSV schema.
- name: execution-model
  description: Trade execution modeling (backtest only) — slippage formulas (linear / square-root impact),
    VWAP/TWAP execution logic, market-impact cost estimation, and execution-assumption configuration.
- name: factor-research
  description: Factor research framework with IC/IR analysis, quantile backtesting, and factor combination.
    Suitable for cross-sectional factor evaluation across multiple instruments.
- name: financial-statement
  description: 财报三表深度解读——三表勾稽关系、盈利质量(应计vs现金流)分析、杜邦分解、10+财务造假红旗指标
- name: fund-analysis
  description: 基金分析与筛选：晨星评级/夏普比率/信息比率、Sharpe风格箱分析、风格漂移检测、基金经理评价、FOF组合构建、ETF选择
- name: fundamental-filter
  description: Fundamental factor screening — filter stocks by PE/PB/ROE, financial statement fields,
    and other metrics for value or growth selection. Supports A-shares (via tushare extra_fields or fundamental_fields)
    and HK/US stocks (via yfinance Ticker info).
- name: geopolitical-risk
  description: '"Geopolitical risk analysis: quantify crisis signals, identify precursors, and build event-driven
    strategies for war, sanctions, and supply disruption scenarios."'
- name: global-macro
  description: Global macro analysis framework (central bank policy transmission / FX forecasting / geopolitical
    risk / capital flows), used to build macro factor signals that drive cross-asset allocation.
- name: harmonic
  description: Harmonic Patterns signal engine. Identifies XABCD five-point structures such as Gartley/Bat/Butterfly/Crab
    based on Fibonacci geometry, and generates trading signals in the PRZ (Potential Reversal Zone).
- name: hedging-strategy
  description: Hedging strategy design (beta hedge / option protection / tail risk / cross-asset hedging),
    including hedge-ratio calculation and cost evaluation.
- name: hk-connect-flow
  description: Stock Connect (Shanghai/Shenzhen-Hong Kong) fund flow analysis — Northbound (foreign into
    A-shares), Southbound (mainland into HK), sector allocation tracking, and cross-border arbitrage signals.
- name: ichimoku
  description: Ichimoku Kinko Hyo five-line system signal engine. A standalone Japanese technical-analysis
    school that generates trading signals from Tenkan/Kijun crossovers, cloud position, and Chikou confirmation.
    Pure pandas implementation.
- name: investor-lenses
  description: Named investor reasoning frameworks packaged as reusable analytical lenses — 12 lenses
    (deep value, quality franchise, inversion, scuttlebutt growth, GARP, cycle positioning, debt cycle,
    forensic short, cost drag, right-business, weak-system contrarian, three questions) that stack on
    top of evidence already gathered, each with ordered priority signals, hard disqualifiers, and documented
    failure modes.
- name: liquidation-heatmap
  description: Liquidation level analysis and heatmap interpretation — identify leveraged position concentration,
    liquidation cascades, stop-hunt zones, and use liquidation data as support/resistance signals.
- name: macro-analysis
  description: Macroeconomic cycle positioning and central-bank policy interpretation, including GDP/CPI/PMI/rates/FX
    analysis, with output in the form of major-asset allocation tilts.
- name: management-deep-dive
  description: '"Deep management assessment — the ''buying a stock is buying a person'' layer. For a company
    or a named executive, evaluate integrity (promise-vs-delivery tracking, crisis behavior, stakeholder
    treatment), ability (strategic foresight, execution, capital-allocation record) and governance (equity
    structure, compensation, related-party deals). Outputs a weighted score across integrity / ability
    / capital-allocation / governance plus Duan Yongping''s 3-question verdict (''would you hand this
    person your money for 10 years''). Use when standard research leaves management quality uncertain,
    or when management IS the investment thesis."'
- name: market-microstructure
  description: '"Market microstructure: bid-ask spread analysis, order-flow toxicity metrics (VPIN / Kyle
    lambda), liquidity measures (Amihud / Roll), price-impact models, limit-order-book analysis, and China
    A-share call auction / block trade mechanics."'
- name: minute-analysis
  description: Minute-level data analysis and backtesting. Retrieves minute candlesticks through OKX/Tushare/yfinance
    and can be used both for analysis and as input to the backtest engine.
- name: ml-strategy
  description: Machine-learning predictive strategy based on sklearn walk-forward training, feature engineering,
    and signal generation. Suitable for any OHLCV data.
- name: mootdx
  description: Mootdx A-share market data via TCP-direct 通达信 servers. Free, no API key, no IP rate limits.
    Use as the stable A-share OHLCV fallback when akshare's East Money scrape is throttled.
- name: multi-factor
  description: Multi-factor cross-sectional stock ranking. Combines factor standardization, equal-weight
    or IC-weighted scoring, and TopN portfolio construction. Suitable for multi-instrument portfolio strategies.
- name: okx-market
  description: OKX cryptocurrency market data interface. Uses the OKX V5 REST API to retrieve spot, derivatives,
    index, and other crypto market data, including real-time prices, candlesticks, funding rates, open
    interest, and more. No authentication required, free to use.
- name: onchain-analysis
  description: On-chain data analysis — active addresses / whale tracking / TVL / DEX liquidity, interpretation
    and signal generation using on-chain valuation metrics such as MVRV / NVT / SOPR.
- name: options-advanced
  description: '"Advanced options strategies: volatility-surface modeling (SABR / Local Vol), dynamic
    Greeks rebalancing, calendar spreads, volatility arbitrage and skew trading, and option market-making
    basics."'
- name: options-payoff
  description: '"Option P&L analysis methodology: payoff diagrams, breakeven calculation, multi-leg strategy
    visualization, and Greeks-based scenario analysis."'
- name: options-strategy
  description: Options strategy framework supporting Black-Scholes pricing, Greeks analysis, and multi-leg
    backtesting. Suitable for cryptocurrency and equity options.
- name: pair-trading
  description: Pair trading strategy. Trades mean reversion using the spread/ratio Z-score of two correlated
    instruments. Requires at least two instruments.
- name: performance-attribution
  description: Performance attribution analysis — Brinson sector/stock-selection attribution, factor alpha/beta
    decomposition, market-timing evaluation, and benchmark comparison framework.
- name: perp-funding-basis
  description: Perpetual futures funding rate analysis and cash-carry basis trading — funding rate regimes,
    annualized basis signals, carry trade construction, and funding rate arbitrage between exchanges.
- name: pine-script
  description: Export backtest strategies to indicator/strategy code for major trading platforms — TradingView,
    通达信, 同花顺, 东方财富, MT5.
- name: private-company-research
  description: '"Deep research framework for pre-IPO / private companies (Ant Group, SpaceX, Stripe, ByteDance...).
    Six analyst lenses — business model, financial forensics, competitive landscape, risk & governance,
    tech & IP, alternative-data signals — run in parallel via run_swarm, then cross-validated for signal
    consistency before any verdict. Built around the core challenge of private-company work: information
    is scarce, so every data point carries a confidence label (high / medium / low), inference is shown
    separately from fact, and ''I don''t know'' is a valid output. Outputs a fair-value range, exit-path
    analysis, and an information-gap map. Use for any unlisted company where you need to judge what the
    business is actually worth."'
- name: quant-statistics
  description: '"Quantitative statistical methods: ADF unit-root / cointegration tests, GARCH volatility
    modeling, regression diagnostics (heteroskedasticity / autocorrelation), Bootstrap, and hypothesis
    testing."'
- name: qveris
  description: Paid capability marketplace for global multi-asset data; use it when free Vibe-Trading
    sources lack coverage, depth, or provider quality, and keep free sources as the default for routine
    OHLCV.
- name: regulatory-knowledge
  description: 金融监管知识库：A股涨跌停/ST退市新规/融券、港股T+0/做空机制、美股PDT/熔断、加密监管政策、跨境税务基础
- name: report-generate
  description: Professional financial research report generation — standard structure (summary / views
    / main body / risks / recommendation), Markdown formatting standards, rating system, and terminology
    guide.
- name: research-discipline
  description: '"A short self-bias checklist to run at the START of any investment research task (stock
    screen / sector study / company deep-dive). Four biases that systematically warp AI research — leader-bias
    (only big caps), English-bias (miss JP/KR/TW players), narrative-bias (chase concept labels), confirmation-bias
    (only bullish evidence) — plus recency-bias. Load this first, then research with the corrections in
    mind. Not a workflow, just a 60-second attitude reset that materially improves coverage and honesty."'
- name: research-goal
  description: 'Goal-driven finance research workflow: attach a research-only objective, track criteria,
    and add evidence while avoiding live trading execution.'
- name: risk-analysis
  description: Risk measurement and stress testing — VaR/CVaR/max drawdown calculation, Monte Carlo simulation,
    extreme-value tail-risk analysis, and historical scenario stress testing.
- name: seasonal
  description: Seasonal/calendar-effect strategy. Generates trading signals from time-based patterns such
    as month-of-year effects and day-of-week effects. Suitable for any OHLCV data.
- name: sec-edgar-fetch
  description: U.S. SEC EDGAR fetch interface — resolve a ticker to its CIK, list recent filings (10-K
    / 10-Q / 8-K and friends) with primary-document URLs, and pull XBRL companyfacts financial series.
    Free, no API key; rate-limited by IP so every request is throttled and carries a contact User-Agent.
    United States only.
- name: sector-rotation
  description: 行业轮动分析——申万行业景气度评分、行业动量排名、产业链传导、估值/盈利/资金流多维比较框架
- name: sentiment-analysis
  description: 市场情绪分析——恐贪指数/Put-Call Ratio/融资融券/北向资金信号解读、社交媒体舆情量化框架。单文本情绪打分或获取加密恐贪指数数值请用 sentiment 工具（sentiment_score
    / fear_greed_index 模式）；本技能提供市场层面情绪分析框架。
- name: shadow-account
  description: '"Shadow Account — 从用户交割单提炼盈利模式（3-5 条人话规则）→ 跨 A股/港股/美股/crypto 多市场回测 → 差值归因 → 8-section
    PDF 报告。叙事：你的影子，没有情绪噪音。"'
- name: smc
  description: Smart Money Concepts (ICT) signal engine. Uses the smartmoneyconcepts library to implement
    institutional-trading-school analysis of BOS, ChoCH, FVG, and order blocks (OB).
- name: social-media-intelligence
  description: '"Social media intelligence: financial signal extraction from Twitter/X, Telegram, Discord,
    and Reddit for sentiment-driven trading strategies."'
- name: stablecoin-flow
  description: Stablecoin supply and flow analysis — USDT/USDC mint-burn signals, exchange stablecoin
    reserves, on-chain stablecoin velocity, and capital rotation indicators for crypto market timing.
- name: strategy-dev-manager
  description: '"Strategy Development Manager: convert academic papers and research reports into validated
    factors and strategies with automated backtesting, persistent storage, and decay monitoring."'
- name: strategy-discovery
  description: '"Strategy Discovery: evidence-gated facade over Alpha Zoo + the SDM strategy store — answers
    what strategies exist and what state they are in, with per-regime evidence instead of scenario tags;
    reports evidence freshness on every returned row and rebuilds the disposable evidence cache from local
    backtest runs."'
- name: strategy-generate
  description: Create, modify, and optimize quantitative trading strategies, then backtest and evaluate
    them.
- name: technical-basic
  description: Core technical indicator collection (trend EMA/ADX + mean-reversion BB/RSI + volume-price
    OBV/volume ratio), generates a composite signal via three-dimensional voting. Pure pandas implementation
    for any OHLCV data.
- name: thesis-tracker
  description: '"Buy-side discipline system. For each holding, maintain a written investment thesis —
    core thesis in 5 sentences, falsifiable assumptions, red lines, valuation anchors — and re-check it
    each quarter against new earnings/events. Scores thesis health 1-10 from assumption breakage and red-line
    triggers, and recommends hold / add / trim / exit. Use it right after buying a stock (to write the
    thesis) and every earnings season (to check it). Bridges the research→buy→monitor gap that most investors
    skip."'
- name: token-unlock-treasury
  description: Token unlock schedule analysis and project treasury tracking — vesting cliffs, linear unlocks,
    team/investor/ecosystem token releases, treasury diversification, and sell pressure forecasting.
- name: trade-journal
  description: Analyze a user's trade journal (CSV/Excel broker export). Parses 同花顺/东方财富/富途/generic formats,
    produces a trading profile and 4 behavior diagnostics (disposition effect, overtrading, chasing, anchoring).
    Use the `analyze_trade_journal` tool.
- name: tushare
  description: tushare是一个财经数据接口包，拥有丰富的数据内容，如股票、基金、期货、数字货币等行情数据，公司财务、基金经理等基本面数据。该模块通过标准化API方式统一了数据资产的对外服务方式，以帮助有需要的技术用户更实时、简洁、轻量的使用相关数据。
- name: us-etf-flow
  description: US ETF fund flow analysis, sector rotation breadth, and style factor flows — track institutional
    capital movement via ETF creation/redemption, sector breadth signals, and thematic momentum.
- name: valuation-model
  description: Valuation methodology — absolute valuation with DCF / DDM / SOTP, relative valuation with
    PE-Band / PB-ROE / EV-EBITDA, sensitivity analysis, and valuation-trap detection.
- name: vnpy-export
  description: Export a Vibe-Trading backtest strategy to a runnable vnpy CtaTemplate Python class — supports
    A-share equities, futures, and crypto via BarGenerator + ArrayManager.
- name: volatility
  description: Volatility strategy. Trades mean reversion based on percentile ranking of historical volatility
    (HV). Suitable for any OHLCV data.
- name: web-reader
  description: Read web pages, articles, and document links by converting URLs into Markdown text. Use
    the `read_url` tool directly, without bash. Sends the full URL to the third-party Jina Reader (r.jina.ai).
- name: yfinance
  description: yfinance global market data interface — retrieve OHLCV and research data for US, HK, and
    Canadian stocks, ETFs, and indices via Yahoo Finance. Free, no API key required.
