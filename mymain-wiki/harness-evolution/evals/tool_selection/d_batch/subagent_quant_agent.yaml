# D1 pilot — quant-agent subagent definition (whitelist layer).
#
# Source: HARNESS_EVOLUTION_CAPABILITY_AUDIT.md §8.1 (D06+D07 domains),
# validated by build_d_corpora.py coverage audit against queries.yaml.
# The description/prompt fields are the routing + behavior layer and are
# refined against the prompt-engineering research brief (D_PLAN §3).
#
# Whitelist revision log (pre-registered rule: one revision round allowed
# after the deterministic coverage audit, revisions recorded here):
# - v0 (AUDIT §8.1 draft): tools=11, skills=9.
# - v1 (coverage audit 2026-08-28): added skills alpha-zoo (D06-007),
#   pine-script (D07-006), vnpy-export (D07-007) — §8.1 draft dead-ended
#   3/20 domain queries at the skill layer. tools unchanged (11/11 covered).
#
# Coverage after v1: D06 10/10, D07 10/10 (expected hits all in whitelist).

name: quant-agent
domain: D06+D07
version: 1

tools:
  - alpha_zoo
  - alpha_bench
  - factor_analysis
  - list_strategies
  - query_strategies
  - get_strategy_evidence
  - backtest
  - write_file
  - read_file
  - pattern_recognition
  - quantlib_call

skills:
  - strategy-generate
  - factor-research
  - multi-factor
  - strategy-discovery
  - strategy-dev-manager
  - ml-strategy
  - backtest-diagnose
  - execution-model
  - cross-market-strategy
  # v1 additions (coverage audit):
  - alpha-zoo
  - pine-script
  - vnpy-export

# Routing signal shown to the parent agent (Chinese+English keywords for
# both judge panel languages; anti-triggers bound the domain).
#
# Revision log (routing layer; pre-registered single revision round,
# D_PLAN §5.7 rule 4):
# - v1 (2026-08-28, first administration): R1 PASS (recall 94%) but R2 FAIL
#   (over-delegation 6.07% > 5%) — D09 portfolio-risk / D08 derivatives /
#   D05 TA queries attracted by advertised quantlib function names
#   (VaR/CVaR/Black-Scholes) and by the broad "strategy" wording.
#   Under-delegation: D07-101 (pattern recognition) + D07-104 (workspace
#   read) went direct — pattern/workspace triggers were unadvertised.
# - v2 (below): de-advertise standalone quantlib math (capability stays in
#   the whitelist; it is just not a routing trigger); add neighbor-domain
#   anti-triggers (portfolio risk on existing holdings / options & perp
#   strategies / TA pattern reads / event-news strategies → stay direct);
#   advertise pattern recognition + workspace file read/write explicitly.
description: >-
  Quantitative strategy research and backtesting workspace. Delegate:
  alpha zoo browsing/benching (Kakushadze/GTJA/Qlib 因子库), factor IC/IR
  analysis and quantile backtests, strategy catalogue queries with
  per-regime evidence, writing and running signal_engine backtests,
  backtest diagnosis, ML walk-forward strategies, execution cost modeling,
  K-line pattern recognition on fetched data (K线形态识别), backtest
  workspace file read/write (回测工作区的 config/metrics/signal_engine
  读写), and strategy export (Pine/通达信/vnpy). 量化策略研究与回测：
  因子、IC、策略生成与诊断、回测工作区。
  NOT for: standalone risk metrics on an existing portfolio (VaR/Sharpe of
  held positions → main agent's quantlib_call), options/perpetual
  derivatives strategies, pure technical-indicator reads (candlestick/
  ichimoku/缠论), event/news-driven strategy design, raw quote browsing
  (get_market_data), fundamentals/filings, web reading, or live trading.

# System prompt is assembled at eval/production build time from
# prompts/quant_agent.md (kept separate for review diffs).
prompt_file: prompts/quant_agent.md
