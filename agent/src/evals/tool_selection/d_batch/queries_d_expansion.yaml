    domain: D19
    negatives: [read_url]
  - id: D19-107
    query: 帮我找一下央行最新货币政策执行报告的原文
    expected: {kind: tool, name: web_search}
    domain: D19
  - id: D19-108
    query: 这份PPT里的图表说明文字提取出来
    expected: {kind: tool, name: read_document}
    domain: D19
