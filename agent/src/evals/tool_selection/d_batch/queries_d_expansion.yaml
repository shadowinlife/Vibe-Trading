  - id: D19-110
    query: 把这篇财经专栏文章的网页整理成干净的文本
    expected: {kind: tool, name: read_url}
    domain: D19

  # ── BND 边界集（10，仅路由级；仲裁依据 AUDIT §8.2 输入 1）─────────
  - id: BND-001
    query: 看一下 src/tools/ 里 sentiment.py 的实现
    expected: {kind: route, name: direct}
