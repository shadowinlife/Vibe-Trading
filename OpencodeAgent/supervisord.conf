; =============================================================================
; supervisord.conf — dual-process tenant stack (plan T10 process-model ruling)
;
;   [opencode-serve]  opencode serve on 127.0.0.1:4096  (container-INTERNAL)
;   [vt-gateway]      vt gateway (uvicorn api_server) on 0.0.0.0:$GATEWAY_PORT
;                     (the SINGLE public port; a PURE HTTP client of serve)
;
; The gateway never spawns serve. serve auto-restarts here on crash; the bridge
; heals on the next send via T6 liveness + _ensure_pumps (no gateway restart).
; Priority starts serve (10) before the gateway (20); gateway-start.sh additionally
; waits for serve /health before exec'ing uvicorn, so cold boot is deterministic.
; =============================================================================

[supervisord]
nodaemon=true
user=opencode
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:opencode-serve]
command=opencode serve --hostname 127.0.0.1 --port 4096 --print-logs --log-level INFO
directory=/workspace
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=100
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:vt-gateway]
command=/workspace/gateway-start.sh
directory=/opt/vibe-trading/agent
priority=20
autostart=true
autorestart=true
startsecs=15
startretries=100
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
